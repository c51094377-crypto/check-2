<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メッシュ結合ツール（座標維持）</title>
<style>
:root{color-scheme:dark;--bg:#11151c;--panel:#1b222d;--line:#303b4b;--text:#edf2f8;--muted:#aab6c5;--accent:#70b7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:22px}
h1{font-size:1.5rem;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.viewer{height:480px;background:#0b0e13;border-radius:8px;overflow:hidden;position:relative}
.viewer canvas{display:block;width:100%;height:100%}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,.filebtn{background:#2b394b;color:var(--text);border:1px solid #43536a;border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit}
button.primary{background:#1764a6;border-color:#328bd3}button:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{max-width:100%;margin:8px 0 12px}
#meshList{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.item{display:flex;align-items:flex-start;gap:8px;padding:7px 4px;border-bottom:1px solid #2b3441;overflow-wrap:anywhere}
.item:last-child{border-bottom:0}.item small{display:block;color:var(--muted)}
.status{color:var(--muted);font-size:.92rem;white-space:pre-wrap}
.note{font-size:.9rem;color:var(--muted);margin-top:12px}
label{display:flex;gap:8px;align-items:center}
@media(max-width:780px){.layout{grid-template-columns:1fr}.viewer{height:360px}}
</style>
</head>
<body>
<main>
<h1>メッシュ結合ツール</h1>
<p class="sub">メッシュのワールド座標を維持して結合。GLBをブラウザ内で処理します。</p>
<div class="layout">
<section class="panel">
<label>GLBファイルを読み込む <input id="file" type="file" accept=".glb,.gltf"></label>
<div class="viewer" id="viewer"></div>
<div class="controls">
<button id="selectAll" disabled>全選択</button>
<button id="selectNone" disabled>全解除</button>
<button id="merge" class="primary" disabled>選択メッシュを結合</button>
<button id="reset" disabled>元に戻す</button>
</div>
<div class="status" id="status">GLBファイルを選択してください。</div>
<p class="note">プレビュー操作：ドラッグで回転、ホイールでズーム。結合は選択したメッシュの形状をワールド座標へ変換してから行います。</p>
</section>
<aside class="panel">
<h2 style="font-size:1.1rem;margin-top:0">メッシュ一覧</h2>
<div class="status" id="count">未読み込み</div>
<div id="meshList">ファイルを読み込むと、メッシュ一覧が表示されます。</div>
<div class="controls">
<button id="export" class="primary" disabled>GLBを書き出す</button>
</div>
<p class="note">注意：結合後はメッシュ単位の編集ができなくなります。元ファイルは変更されません。スキンメッシュ／ボーン付きモデルは対象外です。</p>
</aside>
</div>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';
import { GLTFExporter } from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/exporters/GLTFExporter.js';
import { mergeGeometries } from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/utils/BufferGeometryUtils.js';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0e13);
const camera=new THREE.PerspectiveCamera(50,1,.01,100000); camera.position.set(5,4,7);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); $('viewer').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x4b5565,2));
const light=new THREE.DirectionalLight(0xffffff,2); light.position.set(5,10,7); scene.add(light);
const grid=new THREE.GridHelper(20,20,0x435063,0x27313e); scene.add(grid);
const root=new THREE.Group(); scene.add(root);
let original=null, meshes=[], mergedMesh=null, currentURL=null;
const loader=new GLTFLoader(), exporter=new GLTFExporter();
function resize(){const r=$('viewer').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(r.height,1);camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('viewer')); resize();
function render(){requestAnimationFrame(render);controls.update();renderer.render(scene,camera)}render();
function setStatus(s){$('status').textContent=s}
function disposeGroup(g){g.traverse(o=>{if(o.isMesh){o.geometry?.dispose();if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material?.dispose()}})}
function clearRoot(){while(root.children.length){const o=root.children[0];root.remove(o);if(o.isMesh){o.geometry?.dispose();if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material?.dispose()}}}
function listMeshes(){
 $('meshList').innerHTML='';
 meshes.forEach((m,i)=>{
  const row=document.createElement('label');row.className='item';
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=m.selected;cb.addEventListener('change',()=>{m.selected=cb.checked;setStatus(`${meshes.filter(x=>x.selected).length}個選択中`)});
  const text=document.createElement('span');text.textContent=m.name||`Mesh ${i+1}`;
  const small=document.createElement('small');small.textContent=`頂点 ${m.geometry.attributes.position?.count??0} / ${m.merged?'結合済み':'未結合'}`;
  text.appendChild(small);row.append(cb,text);$('meshList').appendChild(row);
 });
 $('count').textContent=`メッシュ ${meshes.length}個`;
}
function frameObject(obj){
 const box=new THREE.Box3().setFromObject(obj);
 if(!box.isEmpty()){const center=box.getCenter(new THREE.Vector3());controls.target.copy(center);const size=box.getSize(new THREE.Vector3()).length()||1;camera.position.copy(center).add(new THREE.Vector3(size*.8,size*.6,size*.9));camera.near=Math.max(size/10000,.001);camera.far=Math.max(size*100,1000);camera.updateProjectionMatrix();controls.update()}
}
$('file').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
  setStatus('読み込み中…');$('meshList').textContent='読み込み中…';
  const data=await file.arrayBuffer();const gltf=await loader.parseAsync(data,'');
  clearRoot();root.add(gltf.scene);original=gltf.scene.clone(true);mergedMesh=null;
  meshes=[];gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse(o=>{
   if(!o.isMesh)return;
   if(o.isSkinnedMesh||o.morphTargetInfluences){o.userData.unsupported=true}
   meshes.push({object:o,name:o.name||`Mesh ${meshes.length+1}`,geometry:o.geometry,material:o.material,selected:true,merged:false});
  });
  listMeshes();frameObject(gltf.scene);
  ['selectAll','selectNone','merge','reset','export'].forEach(id=>$(id).disabled=false);
  setStatus(`読み込み完了：${meshes.length}個のメッシュ。結合したいものを選択してください。`);
 }catch(err){console.error(err);setStatus('読み込みに失敗しました：'+err.message)}
});
$('selectAll').onclick=()=>{meshes.forEach(m=>m.selected=true);listMeshes();setStatus(`${meshes.length}個選択中`)};
$('selectNone').onclick=()=>{meshes.forEach(m=>m.selected=false);listMeshes();setStatus('選択解除しました')};
$('merge').onclick=()=>{
 const selected=meshes.filter(m=>m.selected);
 if(selected.length<2){setStatus('結合するにはメッシュを2個以上選択してください。');return}
 if(selected.some(m=>m.object.isSkinnedMesh||m.object.morphTargetInfluences)){setStatus('ボーンまたはモーフ付きメッシュは結合できません。');return}
 try{
  const geometries=[];
  for(const m of selected){
   const g=m.geometry.clone();
   // Transform each vertex by its full world matrix, so the resulting mesh can live at identity.
   g.applyMatrix4(m.object.matrixWorld);
   // Material groups are intentionally removed; the merged mesh uses the first selected mesh's material.
   g.clearGroups();geometries.push(g);
  }
  const merged=mergeGeometries(geometries,false);
  if(!merged)throw new Error('頂点属性が異なるため結合できません。');
  const mat=selected[0].material;
  const newMesh=new THREE.Mesh(merged,mat);
  newMesh.name='MergedMesh';newMesh.matrixAutoUpdate=false;newMesh.matrix.identity();
  // Hide selected originals; leave unselected meshes untouched.
  selected.forEach(m=>m.object.visible=false);
  root.add(newMesh);mergedMesh=newMesh;
  meshes.push({object:newMesh,name:'MergedMesh',geometry:merged,material:mat,selected:true,merged:true});
  selected.forEach(m=>m.selected=false);
  listMeshes();setStatus(`${selected.length}個のメッシュを結合しました。元メッシュは非表示にしてあります。座標は維持されています。`);
 }catch(err){console.error(err);setStatus('結合できませんでした：'+err.message)}
};
$('reset').onclick=()=>{if(!$('file').files?.[0])return;$('file').dispatchEvent(new Event('change'))};
$('export').onclick=async()=>{
 try{
  setStatus('GLBを書き出し中…');
  const blob=await new Promise((resolve,reject)=>exporter.parse(root,resolve,reject,{binary:true,onlyVisible:true}));
  const url=URL.createObjectURL(new Blob([blob],{type:'model/gltf-binary'}));
  const a=document.createElement('a');a.href=url;a.download='merged_meshes.glb';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),30000);setStatus('GLBを書き出しました。');
 }catch(err){console.error(err);setStatus('書き出しに失敗しました：'+err.message)}
};
</script>
</body>
</html>
